name: Releases
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
          cache: true

      - name: Install dependencies
        run: sudo apt-get install -y sed grep

      - name: Build and Package
        run: |
          make build-all package-all checksums

      - name: Upload release artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          make_latest: true
          generate_release_notes: true
          files: |
            build/*.zip
            build/*.tar.gz
            build/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-packages:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Create publisher token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
          owner: rackerlabs
          repositories: |
            homebrew-tap
            scoop-bucket

      - name: Checkout Homebrew tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rackerlabs/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap

      - name: Checkout Scoop bucket
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rackerlabs/scoop-bucket
          token: ${{ steps.app-token.outputs.token }}
          path: scoop-bucket

      - name: Download checksums
        run: gh release download "$GITHUB_REF_NAME" --pattern checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Render formula and manifest
        run: .github/scripts/publish-packages.sh "$GITHUB_REF_NAME" checksums.txt homebrew-tap scoop-bucket

      - name: Push to tap and bucket
        run: |
          for repo in homebrew-tap scoop-bucket; do
            git -C "$repo" config user.name "rackerlabs-package-publisher[bot]"
            git -C "$repo" config user.email "noreply@github.com"
            git -C "$repo" add -A
            git -C "$repo" commit -m "understackctl ${GITHUB_REF_NAME}"
            git -C "$repo" push
          done
